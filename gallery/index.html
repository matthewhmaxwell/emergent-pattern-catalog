const M=[{"id": "P1", "name": "Similarity-driven aggregation", "ref": "Schelling 1971", "summary": "Agents relocate when too few neighbors share their type.", "effect": "Mild individual preference produces large segregated clusters.", "viz": "grid_field", "watch": "Watch the two intermixed groups sort into large single-color blocks (empty cells stay gray) \u2014 nobody is forced, yet sharp segregated neighborhoods form.", "metric": "morans_i", "mechanism": "Each agent moves only if too few of its immediate neighbors share its type \u2014 a mild local preference, not a wish to segregate. But every move changes other agents' neighborhoods, triggering more moves; the feedback cascades until the grid sorts into large single-type blocks. Strong global segregation emerges from weak individual preference, with no one intending it.", "detector": {"top": "P1", "tier": "definitive", "confidence": 1.0, "verdict": "MATCH", "emergence": 0.7769, "self_recognized": true, "neg_total": 27, "neg_rejected": 27, "neg_breakdown": {"synthetic": 9, "catalog": 8, "failed_regime": 10}}, "code": "def run_schelling(\n    grid_size: int = 50,\n    density: float = 0.9,\n    threshold: float = 0.375,\n    n_steps: int = 200,\n    seed: int = 42,\n) -> List[Dict]:\n    \"\"\"Run Schelling segregation model.\n\n    Parameters\n    ----------\n    grid_size : int\n        Side length of square grid.\n    density : float\n        Fraction of cells occupied.\n    threshold : float\n        Minimum same-type neighbor fraction for satisfaction.\n        Schelling's original: 3/8 = 0.375 (3 of 8 neighbors).\n    n_steps : int\n        Number of time steps.\n    seed : int\n        RNG seed.\n\n    Returns\n    -------\n    List of state dicts with 'grid' key (2D array: 0=empty, 1=type A, 2=type B).\n    \"\"\"\n    rng = np.random.default_rng(seed)\n\n    N = grid_size * grid_size\n    n_occupied = int(N * density)\n    n_type_a = n_occupied // 2\n    n_type_b = n_occupied - n_type_a\n\n    # Initializ egions denser still \u2014 a positive feedback. With no attraction between particles at all, this density-dependent speed alone splits the system into dense and dilute phases, like a gas condensing purely from how motion responds to crowding.", "detector": {"top": "P2", "tier": "none", "confidence": 0.75, "verdict": "EMERGENT-UNCLASSIFIED", "emergence": 0.5368, "self_recognized": true, "neg_total": 24, "neg_rejected": 24, "neg_breakdown": {"synthetic": 9, "catalog": 5, "failed_regime": 10}}, "code": "def step(self) -> dict[str, Any]:\n    \"\"\"Advance one dt under Fily-Marchetti ABP dynamics.\n\n    Order of operations (Euler-Maruyama):\n      1. Compute local densities rho_i at current positions.\n      2. Compute speeds v_i = v0 * max(0, 1 - rho_i / rho_star).\n      3. Update positions: r_i <- r_i + v_i * e(theta_i) * dt.\n      4. Update headings: theta_i <- theta_i + sqrt(2 D_r dt) * eta,\n         eta ~ N(0, 1).\n      5. Wrap positions into [0, L) (periodic).\n    \"\"\"\n    N = self.n_particles\n    L = self.box_size\n\n    # --- Local density via cKDTree with periodic BC ---\n    tree = cKDTree(self.positions, boxsize=L)\n    # count_neighbors with eps=r_cg INCLUDES self (distance 0)\n    counts = tree.query_ball_point(self.positions, r=self.r_cg, return_length=True)\n    counts = np.asarray(counts, dtype=np.float64)\n    area = np.pi * self.r_cg**2\n    rho_local = counts / area  # (N,)\n\n    # --- Density-dependent speed (Fily-Marchetti linear law) ---\n    v_local = self.v0 * np.maximum(0.0, 1.0 - rho_local / self.rho_star)\n\n    # --- Propulsion step ---\n    cos_t = np.cos(self.headings)\n    sin_t = np.sin(self.headings)\n    self.positions[:, 0] += v_local * cos_t * self.dt\n    self.positions[:, 1] += v_local * sin_t * self.dt\n\n    # --- Rotational diffusion step ---\n    eta = self.rng.standard_normal(N)\n    self.headings += np.sqrt(2.0 * self.D_r * self.dt) * eta\n    # Wrap to [-pi, pi)\n    self.headings = (self.headings + np.pi) % (2 * np.pi) - np.pi\n\n    # --- Periodic BC on positions ---\n    self.positions %= L\n\n    self._step_count += 1\n    return self.get_state()", "code_where": "ActiveBrownianParticles.step()", "code_module": "epc.models.active_brownian_particles", "asset": "p2_sprite.png", "asset_type": "sprite", "sprite": {"frames": 35, "cols": 6, "rows": 6, "fw": 300, "fh": 300, "mp4": "p2.mp4"}, "mp4": "p2.mp4", "contact_sheet": "p2_sprite.png", "where": "Swimming bacteria and cells in dense tissue piling into clusters (biology); synthetic active matter \u2014 self-propelled Janus colloids and microswimmers that jam into dense patches with no glue (lab/technology)."}, {"id": "P3", "name": "Turing pattern formation", "ref": "Gray-Scott (Pearson 1993)", "summary": "Reaction-diffusion with a fast inhibitor and slow activator.", "effect": "A stationary labyrinth at a selected wavelength self-organizes from near-uniformity.", "viz": "grid_field", "watch": "Watch the near-uniform field break into a maze of stripes/spots at one repeating spacing.", "metric": "turing_discriminant", "mechanism": "Two species diffuse at different rates: a slow, self-amplifying 'activator' and a fast-spreading 'inhibitor'. Activation builds a local peak while the faster inhibitor suppresses the surroundings, stopping peaks from merging. This short-range activation with long-range inhibition selects one characteristic spacing, turning a near-uniform medium into a stationary striped/spotted pattern \u2014 Turing's insight that diffusion can create structure, not just smear it away.", "detector": {"top": "P3", "tier": "definitive", "confidence": 1.0, "verdict": "MATCH", "emergence": 0.7551, "self_recognized": true, "neg_total": 16, "neg_rejected": 16, "neg_breakdown": {"synthetic": 9, "catalog": 2, "failed_regime": 5}}, "code": "def step(self) -> dict[str, Any]:\n    if not self._is_setup:\n        self.setup()\n\n    u, v = self._u, self._v\n    lu = self._laplacian5(u)\n    lv = self._laplacian5(v)\n    uvv = u * v * v\n\n    u_new = u + self.dt * (self.Du * lu - uvv + self.feed_rate * (1.0 - u))\n    v_new = v + self.dt * (self.Dv * lv + uvv - (self.feed_rate + self.kill_rate) * v)\n\n    # Stability clamp. Concentrations are not supposed to leave [0, 1] but\n    # finite-precision drift is occasionally possible; clamp avoids NaN\n    # runaway if user supplies a very unstable (F, k) pair.\n    np.clip(u_new, 0.0, 1.0, out=u_new)\n    np.clip(v_new, 0.0, 1.0, out=v_new)\n\n    self._u = u_new\n    self._v = v_new\n    self._step_count += 1\n    return self._snapshot()", "code_where": "GrayScott.step()", "code_module": "epc.models.gray_scott", "asset": "p3_sprite.png", "asset_type": "sprite", "sprite": {"frames": 40, "cols": 7, "rows": 6, "fw": 300, "fh": 300, "mp4": "p3.mp4"}, "mp4": "p3.mp4", "contact_sheet": "p3_sprite.png", "where": "Animal coat and skin markings \u2014 leopard spots, zebra stripes, fish pigmentation \u2014 plus sand ripples and banded desert vegetation (nature); the Belousov\u2013Zhabotinsky reaction and patterning in chemical reactors (lab)."}, {"id": "P4", "name": "Territoriality / exclusion", "ref": "Giuggioli et al. 2011", "summary": "Agents deposit and avoid foreign scent as they move.", "effect": "Exclusive home ranges with sharp boundaries emerge.", "viz": "occupancy_field", "watch": "Watch each cell take the color of the agent that visits it most \u2014 the colors separate out as agents settle into their own home-range patches and stop sharing ground.", "metric": "avoidance_ratio", "mechanism": "Each animal deposits scent as it moves and steps away from cells marked by others. Because everyone retreats from foreign scent, overlapping ranges are pushed apart until each settles into its own patch with sharp borders. Exclusive territories emerge from a simple 'avoid the neighbors' smell' rule \u2014 no fighting, no negotiation.", "detector": {"top": "P4", "tier": "definitive", "confidence": 1.0, "verdict": "MATCH", "emergence": 0.0105, "self_reco wing_spacetime", "watch": "Watch agents settle onto consistent task-rows \u2014 stable specialised roles (division of labor).", "metric": "entropy_decline", "mechanism": "Each agent takes whichever task it senses most strongly, and its threshold for that task falls with practice, so it specialises. Because specialists handle their task before others' thresholds are tripped, stable, distinct roles differentiate across the group. Division of labor \u2014 like castes in social insects \u2014 emerges from response thresholds plus learning, with no assignment.", "detector": {"top": "P32", "tier": "definitive", "confidence": 0.9523809523809523, "verdict": "MATCH", "emergence": 0.0903, "self_recognized": true, "neg_total": 21, "neg_rejected": 21, "neg_breakdown": {"synthetic": 9, "catalog": 2, "failed_regime": 10}}, "code": "def step(self) -> dict[str, Any]:\n    \"\"\"Advance one timestep.\n\n    Each agent independently evaluates all tasks. The probability of\n    responding to task j is  s_j^2 / (s_j^2 + \u03b8_{i,j}^2)  where s_j\n    is the stimulus for task j and \u03b8_{i,j} is agent i's threshold for\n    task j (Bonabeau et al. 1996, Eq. 1).\n\n    If an agent responds to a task:\n      - Its threshold for that task DECREASES by reinforcement_rate\n    If an agent does NOT respond to a task:\n      - Its threshold for that task INCREASES by forgetting_rate\n\n    Stimulus accumulates at stimulus_rate per timestep for each task,\n    reduced by the number of agents performing it.\n    \"\"\"\n    assert self._thresholds is not None\n\n    # Compute response probabilities: s^2 / (s^2 + \u03b8^2)\n    s2 = self._stimulus ** 2  # (n_tasks,)\n    th2 = self._thresholds ** 2  # (n_agents, n_tasks)\n    denom = s2[np.newaxis, :] + th2\n    denom = np.where(denom > 0, denom, 1e-12)\n    prob = s2[np.newaxis, :] / denom  # (n_agents, n_tasks)\n\n    # Each agent decides independently for each task\n    rand = self.rng.random((self.n_agents, self.n_tasks))\n    responds = rand < prob  # boolean (n_agents, n_tasks)\n\n    # Assign each agent to at most one task (highest-probability task\n    # among those it responds to; if none, idle)\n    assignments = np.full(self.n_agents, -1, dtype=np.int64)\n    for i in range(self.n_agents):\n        active_tasks = np.where(responds[i])[0]\n        if len(active_tasks) > 0:\n            # Pick the task with highest response probability\n            best = active_tasks[np.argmax(prob[i, active_tasks])]\n            assignments[i] = best\n\n    self._task_assignments = assignments\n\n    # Threshold reinforcement / forgetting\n    for i in range(self.n_agents):\n        if assignments[i] >= 0:\n            task = assignments[i]\n            # Decrease threshold for performed task\n            self._thresholds[i, task] = max(\n                0.01,\n                self._thresholds[i, task] - self.reinforcement_rate,\n            )\n            # Increase threshold for all other tasks\n            for j in range(self.n_tasks):\n                if j != task:\n                    self._thresholds[i, j] = min(\n                        1.0,\n                        self._thresholds[i, j] + self.forgetting_rate,\n                    )\n        else:\n            # Idle agent: all thresholds drift up\n            self._thresholds[i, :] = np.minimum(\n    # \u2026 (truncated; full source in the repo)", "code_where": "ResponseThresholdModel.step()", "code_module": "epc.models.division_of_labor", "asset": "p32_sprite.png", "asset_type": "sprite", "sprite": {"frames": 35, "cols": 6, "rows": 6, "fw": 300, "fh": 300, "mp4": "p32.mp4"}, "mp4": "p32.mp4", "contact_sheet": "p32_sprite.png", "where": "Division of labor and castes in ant and bee colonies via response thresholds, and cell differentiation (biology); task allocation and work scheduling in swarm robotics and distributed systems (technology)."}, {"id": "P33", "name": "Active nematic order", "ref": "Sanchez et al. 2012", "summary": "Apolar self-propelled vel,\n                           \"positions\": pos.copy(), \"headings\": ang, \"box_size\": float(G)})\n    return frames, {\"model\": \"active_nematic_field\", \"eta\": eta, \"box_size\": float(G),\n                    \"init_mode\": init_mode}", "code_where": "active_nematic_field()", "code_module": "epc.models.active_nematic"}, {"id": "P34", "name": "Adaptive-network fragmentation", "ref": "Holme & Newman 2006", "summary": "Nodes rewire ties toward same-opinion peers while opinions spread; the network coevolves.", "effect": "Topology coevolves with state and fragments into communities.", "viz": "adjacency_blocks", "watch": "Watch the adjacency matrix (reordered by opinion) split into two clean diagonal blocks \u2014 the network fragments into disconnected same-opinion communities.", "metric": "modularity_gain", "detector": {"top": "P34", "tier": "definitive", "confidence": null, "verdict": "TNR 1.0 \u00b7 d=16.7", "emergence": null, "self_recognized": true}, "asset": "p34.gif", "code": "def adaptive_voter(seed: int = 0, N: int = 200, mean_deg: int = 4, phi: float = 0.99,\n                   max_steps: int = 400000, n_frames: int = 80) -> Built:\n    \"\"\"Adaptive voter -> fragmentation transition (the evolving-network positive).\"\"\"\n    rng = np.random.default_rng(seed)\n    op = rng.integers(0, 2, N)\n    p = mean_deg / (N - 1)\n    A = (np.triu(rng.random((N, N)), 1) < p).astype(np.int8)\n    A = A + A.T\n    frames: List[Dict[str, Any]] = []\n    snap = max(1, max_steps // n_frames)\n    for step in range(max_steps):\n        i = int(rng.integers(N))\n        nbrs = np.nonzero(A[i])[0]\n        if nbrs.size == 0:\n            if step % snap == 0:\n                frames.append({\"adjacency\": A.astype(float).copy(), \"opinions\": op.copy()})\n            continue\n        j = int(nbrs[rng.integers(nbrs.size)])\n        if op[i] != op[j]:\n            if rng.random() < phi:\n                same = np.nonzero(op == op[i])[0]\n                same = same[(same != i)]\n                if same.size:\n                    l = int(same[rng.integers(same.size)])\n                    A[i, j] = A[j, i] = 0\n                    A[i, l] = A[l, i] = 1\n            else:\n                op[i] = op[j]\n        if step % snap == 0:\n            frames.append({\"adjacency\": A.astype(float).copy(), \"opinions\": op.copy()})\n    frames.append({\"adjacency\": A.astype(float).copy(), \"opinions\": op.copy()})\n    return frames, {\"model\": \"adaptive_voter\", \"phi\": phi, \"N\": N, \"mean_deg\": mean_deg}", "code_where": "adaptive_voter()", "code_module": "epc.models.adaptive_network"}, {"id": "P35", "name": "Entropy-driven crystallization", "ref": "Alder & Wainwright 1957", "summary": "Purely repulsive disks order by excluded volume alone \u2014 no attraction, just packing entropy.", "effect": "Hexatic crystalline order emerges from packing alone.", "viz": "hexatic", "watch": "Watch the disks brighten into hexatic (six-fold) crystalline grains as packing tightens \u2014 order from entropy, with no attractive force.", "metric": "psi6_gain", "detector": {"top": "P35", "tier": "definitive", "confidence": null, "verdict": "TNR 1.0 \u00b7 d=8.3", "emergence": null, "self_recognized": true}, "asset": "p35.gif", "code": "def hard_disk_crystallization(seed: int = 0, N: int = 196, L: float = 14.0,\n                              eta_end: float = 0.74, n_steps: int = 2500,\n                              n_frames: int = 80, dt: float = 0.05,\n                              noise0: float = 0.16) -> Built:\n    \"\"\"Entropy/packing-driven crystallization (the none_entropy positive).\"\"\"\n    rng = np.random.default_rng(seed)\n    pos = rng.uniform(0, L, size=(N, 2))\n    d_end = 2.0 * np.sqrt(eta_end * L * L / (N * np.pi))\n    d0 = 0.30 * d_end\n    frames: List[Dict[str, Any]] = []\n    snap = max(1, n_steps // n_frames)\n    for step in range(n_steps):\n        frac = step / n_steps\n        d = d0 + (d_end - d0) * frac\n        F = _step_forces(pos, d, L)\n        pos = (pos + dt * F + rng.normal(0, noise0 * (1.0 - frac), size=(N, 2))) % L\n        if step % snap == 0:\n            frames.append({\"positions\": pos.copy()})\n    frames.append({\"positions\": pos.copy()})\n    return frames, {\"model\": \"hard_disk_crystallization\", \"eta_end\": eta_end,\n                    \"N\": N, \"box_size\": L}", "code_where": "hard_disk_crystallization()", "code_module": "epc.models.entropy_crystal"}, {"id": "P36", "name": "Pareto wealth tail (heterogeneous exchange)", "ref": "Chatterjee-Chakrabarti-Manna 2004", "summary": "Agents with differing saving propensities trade a conserved resource in random pairs.", "effect": "A Pareto power-law wealth tail emerges from agent heterogeneity.", "viz": "wealth_tail", "watch": "Watch the wealth survival curve spread from an equal start and grow a straight-line power-law (Pareto) tail \u2014 heavy-tailed inequality, from agent heterogeneity alone.", "metric": "pareto_advantage", "detector": {"top": "P36", "tier": "definitive", "confidence": null, "verdict": "TNR 1.0 \u00b7 d=13.9", "emergence": null, "self_recognized": true}, "asset": "p36.gif", "code": "def kinetic_exchange(seed: int = 0, N: int = 3000, hetero: bool = True,\n                     lam_fixed: float = 0.5, n_sweeps: int = 5000,\n                     n_frames: int = 40) -> Built:\n    \"\"\"Heterogeneous (positive) vs homogeneous (control) CC kinetic exchange.\n\n    hetero=True : per-agent lambda_i ~ U[0, 1) -> Pareto power-law tail (P36).\n    hetero=False: a single lambda = lam_fixed  -> Gamma (lam>0) / exponential (lam=0).\n    \"\"\"\n    rng = np.random.default_rng(seed * 7919 + 1)\n    if hetero:\n        lam = np.clip(rng.uniform(0.0, 1.0, size=N), 0.0, 0.9999)\n    else:\n        lam = np.full(N, float(lam_fixed))\n    frames = _cc_sweeps(seed, N, lam, n_sweeps, n_frames)\n    return frames, {\"model\": \"kinetic_exchange\", \"N\": N, \"hetero\": hetero,\n                    \"lam_fixed\": (None if E": "#718096"}, OVERVIEW="\n<h2>Emergence \u2014 complex behavior from simple rules</h2>\n<p>A flock of starlings wheels as one. A market settles on a price. An ant colony\nfinds the shortest path to food. No bird leads, no trader sees the whole market,\nno ant holds a map \u2014 each follows a few simple <b>local</b> rules, yet coherent,\nlarge-scale order appears that none of them designed or even represents. That is\n<b>emergence</b>: global structure and behavior arising from many agents\ninteracting locally, with no central controller and no blueprint.</p>\n\n<p>The recurring surprise is that <b>the pattern is not \"in\" any individual</b> \u2014 it\nis a collective property. You cannot find the flock in a single bird, segregation\nin one household's mild preference, or a memory in one neuron. The behavior lives\nin the <i>interactions</i>.</p>\n\n<p>This catalog collects <b>32 of these phenomena</b> from across physics, biology,\nand society \u2014 flocking, phase separation, Turing patterns, synchronization,\nepidemics, opinion dynamics, wealth inequality, division of labor,\nself-organized criticality, and more. Each is a <b>minimal model</b>: the\nsimplest rule that still produces the effect, so you can see exactly how little is\nneeded.</p>\n\n<p><b>How to read each entry:</b> play the animation, note <i>what to look for</i>,\nread <i>how it emerges</i> (the mechanism), see the few lines of code that drive\nit, and watch the validated detector recognize the pattern and report its\ncalibrated confidence.</p>\n\n<p>The through-line: <b>complexity does not require a complex cause.</b> A handful of\nlocal rules \u2014 copy your neighbor, avoid the crowd, react to a threshold \u2014 is\nenough to generate the rich collective behavior that fills the living and\nphysical world.</p>\n", METHODS="\n<h2>How these models are validated</h2>\n<p>The 32 phenomena in this catalog are <b>established, literature-validated\nscience</b> \u2014 Schelling segregation, Turing patterns, Kuramoto synchronisation,\nand so on. The science is not what is new here. What is new is a set of\n<b>minimal executable models</b>, each paired with a <b>detector</b> \u2014 an\nalgorithm that decides, from the raw simulation output alone, whether the named\npattern is present \u2014 and a test of whether that detector actually works.</p>\n<p>\"Validated\", on every pattern page, means the detector passed the tests\nbelow. It does <b>not</b> mean the science is novel, and it does <b>not</b> mean\nthe detector is infallible. Where it has limits, we show them.</p>\n\n<h3>1 \u00b7 Negative-control discrimination \u2014 the main test</h3>\n<p>A detector that just says \"yes\" is worthless. So each detector faces a\n<b>panel of negatives it must reject</b>, in three families:</p>\n<ul>\n<li><b>Synthetic nulls</b> \u2014 structureless or random inputs with no pattern at all.</li>\n<li><b>Catalog look-alikes</b> \u2014 the <i>other</i> patterns in this catalog,\nseveral of which superficially resemble the target.</li>\n<li><b>Failed regimes</b> \u2014 the target's own model run in parameter settings\nwhere the phenomenon does not form.</li>\n</ul>\n<p>Across the 31 patterns with a panel, detectors rejected <b>636 of 636</b>\nnegative controls \u2014 a true-negative rate of <b>1.0</b>, every panel at 100%.\nEach pattern page shows its own count (\"rejected N / N negative controls\"). This\nis the evidence that a detector recognizes <i>its</i> pattern, not merely \"something happened\".</p>\n\n<h3>2 \u00b7 Cross-model generalization \u2014 an instrument, not a lookup table</h3>\n<p>A detector could cheat by memorising quirks of the one model it was built on.\nTo check, for seven phenomena we built a <b>second, independent implementation</b>\n(for example, associative memory via a Boolean gene-regulatory network instead of\na Hopfield net) and tested the detector on the model it was <i>not</i> tuned on.\nAll seven still ranked their own pattern first; six fired a firm match. The\ndetectors track the <b>phenomenon</b>, not the implementation.</p>\n\n<h3>3 \u00b7 Self-recognition \u2014 necessary but weak</h3>\n<p>Running all 32 detectors over each positive, the correct detector wins for\n<b>30 of 31</b> patterns (one cross-fire between two grid-coarsening patterns).\nWe report it for completeness, but it is <b>in-sample</b> evidence \u2014 the weakest\nof the three tests, and not a validation on its own.</p>\n\n<h3>Honest caveats</h3>\n<ul>\n<li><b>A withdrawn effect size.</b> An earlier draft reported large Cohen's\n<i>d</i> values, some infinite. Those were an <b>artefact</b> of computing\n<i>d</i> over a discrete confidence score: a cleanly discriminating detector has\nnear-zero within-group variance, which inflates <i>d</i> without meaning. We have\nwithdrawn those numbers. On the continuous metric, clean separation often makes\nthe effect size <b>undefined</b> rather than infinite, and we say so.</li>\n<li><b>\"Generic emergence\" is not the verdict.</b> Each page also shows a coarse,\ncross-pattern \"generic emergence index\". It is a rough screen, <b>not</b> the\npattern-specific result \u2014 a detector can fire a definitive match while this index\nis low (associative memory is one). Trust the verdict and the negative-control\npanel, not this number.</li>\n<li><b>Tiers differ.</b> A <b>definitive</b> match is stronger than a\n<b>confirmation</b> or <b>screening</b> one; a few patterns reach only screening\non a single seed.</li>\n<li><b>Known limits, surfaced not hidden.</b> One pattern (activity-induced phase\nseparation) rejects its negatives but does not yet reach a firing tier on its own\npositive \u2014 shown as \"unclassified\". The delayed-gratification / sorting pattern is\nvalidated by a separate multi-run test, not a panel. An integral-controller\nhomeostat is recognized but stays below threshold.</li>\n<li>All of this validates the faithfulness of our <b>detectors and test\nharness</b> \u2014 not any new claim about nature.</li>\n</ul>\n\n<h3>Reproduce</h3>\n<p>Everything is open. The models, detectors, the Phase-2a negative-control\npanels and the full validation note (section&nbsp;4A) are in the source\nrepository:\n<a href=\"https://github.com/matthewhmaxwell/emergent-pattern-catalog\" target=\"_blank\" rel=\"noopener\">github.com/matthewhmaxwell/emergent-pattern-catalog</a>\n\u2014 specifically <a href=\"https://github.com/matthewhmaxwell/emergent-pattern-catalog/blob/validation-rebuild/docs/paper_section4A_validation_rebuild.md\" target=\"_blank\" rel=\"noopener\">the validation note</a>\nand the <a href=\"https://github.com/matthewhmaxwell/emergent-pattern-catalog/tree/validation-rebuild/analysis/outputs\" target=\"_blank\" rel=\"noopener\">per-pattern panel outputs</a>.</p>\n";

ovl.id='ovl'; ovl.className='ovl';
ovl.setAttribute('role','dialog'); ovl.setAttribute('aria-modal','true');
ovl.setAttribute('aria-label','Enlarged visualization'); ovl.setAttribute('aria-hidden','true');
ovl.innerHTML=`<div class=ovl-top><span id=ovlcap class=ovl-cap></span><span class=ovl-actions>
  <button id=ovlfs class=ovl-btn type=button>⛶ Fullscreen</button>
  <button id=ovlx class=ovl-btn type=button aria-label="Close enlarged view">✕ Close</button></span></div>
  <div id=ovlstage class=ovl-stage role=img></div>
  <div class=ovl-bar><button id=ovlpp class=ovl-cbtn type=button aria-label="Pause animation">⏸</button>
  <button id=ovlrs class=ovl-cbtn type=button aria-label="Reset to first frame">⟲</button>
  <input id=ovlsl class=ovl-range type=range min=0 value=0 aria-label="Animation frame">
  <span id=ovlfc class=ovl-fc aria-hidden=true></span>
  <select id=ovlspd class=ovl-sel aria-label="Playback speed"><option value=0.25>0.25×</option><option value=0.5>0.5×</option><option value=1 selected>1×</option><option value=2>2×</option><option value=4>4×</option></select></div>`;
document.body.appendChild(ovl);
const OVL={el:ovl, cap:ovl.querySelector('#ovlcap'), stage:ovl.querySelector('#ovlstage'),
  pp:ovl.querySelector('#ovlpp'), rs:ovl.querySelector('#ovlrs'), sl:ovl.querySelector('#ovlsl'),
  fc:ovl.querySelector('#ovlfc'), spd:ovl.querySelector('#ovlspd'), fs:ovl.querySelector('#ovlfs'), x:ovl.querySelector('#ovlx')};
function fsActive(){return document.fullscreenElement||document.webkitFullscreenElement;}
function closeOverlay(){
  if(fsActive() && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  ovl.classList.remove('open'); ovl.setAttribute('aria-hidden','true'); paintBigRef=null;
  if(lastEnl && document.contains(lastEnl)) lastEnl.focus();
  lastEnl=null;
}
OVL.x.onclick=closeOverlay;
ovl.addEventListener('click', e=>{ if(e.target===ovl) closeOverlay(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && ovl.classList.contains('open')) closeOverlay(); });
const reqFS=ovl.requestFullscreen||ovl.webkitRequestFullscreen;
if(!reqFS) OVL.fs.style.display='none';
OVL.fs.onclick=()=>{ if(!fsActive()){ reqFS&&reqFS.call(ovl); } else if(document.exitFullscreen){ document.exitFullscreen(); } };
document.addEventListener('fullscreenchange', ()=>{ OVL.fs.textContent=fsActive()?'⛶ Exit fullscreen':'⛶ Fullscreen'; if(ovl.classList.contains('open')&&paintBigRef) paintBigRef(true); });
window.addEventListener('resize', ()=>{ if(ovl.classList.contains('open')&&paintBigRef) paintBigRef(true); });

function methLink(){return `<div class=foot><a href="#methods" class=methlink onclick="navigate('methods');return false;">How we validate ↗</a></div>`;}
function detectorHtml(d){
  const vc=VC[d.verdict]||'#718096';
  const TG={definitive:'strongest tier — the detector fired its most specific gate',
            confirmation:'mid tier — a corroborating gate fired',
            screening:'weakest tier — only a coarse screening gate fired',
            none:'did not reach a firing tier on this run'};
  if(!d.verdict) return `<div style=color:#8b98a5>${d.note||'—'}</div>`+methLink();
  let disc='';
  if(d.neg_total){
    const b=d.neg_breakdown||{}, parts=[];
    if(b.synthetic) parts.push(b.synthetic+' synthetic nulls');
    if(b.catalog) parts.push(b.catalog+' look-alikes');
    if(b.failed_regime) parts.push(b.failed_regime+' failed regimes');
    disc=`<div class=disc><span class=lab title="Negative controls the detector had to reject: structureless nulls, the other catalog patterns, and the model run where the pattern never forms.">Discrimination · negative controls</span>rejected <strong>${d.neg_rejected}/${d.neg_total}</strong>${parts.length?` <span class=mut2>(${parts.join(' · ')})</span>`:''}</div>`;
  } else if(d.note){
    disc=`<div class=disc><span class=lab>Discrimination</span><span class=mut2>${d.note}</span></div>`;
  }
  let cm='';
  if(d.cross_model){
    const c=d.cross_model;
    cm = c.verdict==='MATCH'
      ? `<div class=cmline title="Re-tested on a second, independent implementation it was never tuned on, and still recognized the phenomenon.">✓ Generalizes to an independent model <span class=mut2>(${c.alt})</span></div>`
      : `<div class=cmline title="On an independent model it ranked its own pattern first but stayed below the firing threshold — a disclosed generalization limit.">~ Ranks top on an independent model <span class=mut2>(${c.alt}, below threshold)</span></div>`;
  }
  const ge=d.emergence!=null?(+d.emergence).toFixed(2):'—';
  const foot=`<div class=foot><span class=hint title="A coarse, cross-pattern emergence index — NOT this detector's verdict. A definitive match can sit beside a low value here; trust the verdict and the panel.">generic emergence index ${ge}</span>`
    +(d.self_recognized?` · <span class=hint title="Among all 32 detectors run on this pattern, the correct one ranked first. In-sample evidence — the weakest of the three tests.">self-identifies in the 32-detector battery</span>`:'')
    +`</div>`;
  return `<span class=badge style="background:${vc}">${d.verdict}</span><span class=tier title="${TG[d.tier]||''}">${d.tier||'—'}</span>`
    + disc + cm + foot + methLink();
}

function show(i){
  clearTimer(); if(ovl.classList.contains('open')) closeOverlay();
  try{
    const m=M[i], d=m.detector||{};
    setSelected(i);
    const desc=esc(m.watch||m.effect);
    let vizHtml='';
    if(m.asset_type==='sprite' && m.sprite){
      const s=m.sprite;
      const mp4name=m.id+'_'+slug(m.name)+'.mp4', pngname=m.id+'_'+slug(m.name)+'_frames.png';
      vizHtml=`<div class=stage id=stage role=img aria-label="${m.id} ${esc(m.name)} animation. ${desc}" style="width:${s.fw}px;height:${s.fh}px;max-width:100%;background-image:url(assets/${m.asset})"></div>
        <div class=bar>
        <button id=pp aria-label="Pause animation">⏸</button>
        <button id=rs aria-label="Reset to first frame">⟲</button>
        <input type=range id=sl min=0 max=${s.frames-1} value=0 aria-label="Animation frame">
        <span id=fc aria-hidden=true style="color:var(--mut);font-size:12px;min-width:48px">0/${s.frames-1}</span>
        <select id=spd aria-label="Playback speed"><option value=0.25>0.25×</option><option value=0.5>0.5×</option><option value=1 selected>1×</option><option value=2>2×</option><option value=4>4×</option></select></div>
        <button class=dl id=enl type=button title="Open a large, in-page view (supports fullscreen) — no popup window">⛶ Enlarge</button>${m.mp4?`<a class=dl href="assets/${m.mp4}" download="${mp4name}">⤓ MP4</a>`:''}${m.asset?`<a class=dl href="assets/${m.asset}" download="${pngname}" title="One PNG with all ${s.frames} frames tiled in a grid (a sprite sheet, not a single still)">⤓ Frame sheet (PNG)</a>`:''}`;
    } else if(m.asset){
      vizHtml=`<img src="assets/${m.asset}" alt="${m.id} ${esc(m.name)}: ${desc}">`;
    } else { vizHtml='<p style=color:#8b98a5>(no visualization)</p>'; }
    const watchHtml=m.watch?`<div class=watch><b>&#128065; What to look for</b>${m.watch}</div>`:'';
    const det = detectorHtml(d);
    detail.innerHTML=`<div class=cols>
      <div class=viz>${vizHtml}${watchHtml}</div>
      <div class=info>
        <h2 tabindex=-1>${m.id} · ${m.name}</h2><div class=ref>${m.ref}</div>
        <h3 class=k>What it is</h3><div class=v>${m.summary}</div>
        <h3 class=k>Emergent effect</h3><div class=v>${m.effect}</div>
        <h3 class=k>How it emerges</h3><div class=v>${m.mechanism||''}</div>
        <h3 class=k>Where you see it</h3><div class=v>${m.where||''}</div>
        <h3 class=k>Canonical metric</h3><div class=v><code>${m.metric||'—'}</code></div>
        <div class=card><h3>Detector readout (validated battery)</h3>${det}</div>
      </div></div>
      <details class=card open><summary class=codesum>Core algorithm · <code>${m.code_module||''} ${m.code_where||''}</code></summary>
        <pre class=codeblk>${hl(m.code||'# (unavailable)')}</pre></details>`;
    if(m.asset_type==='sprite' && m.sprite) initSprite(m);
  }catch(err){
    detail.innerHTML='<div class=about><h2>Could not render this pattern</h2><p style=color:#8b98a5>'+(err&&err.message||err)+'</p></div>';
  }
}

function initSprite(m){
  const s=m.sprite, stage=document.getElementById('stage'),
    pp=document.getElementById('pp'), rs=document.getElementById('rs'),
    sl=document.getElementById('sl'), fc=document.getElementById('fc'), spd=document.getElementById('spd'),
    enl=document.getElementById('enl');
  const BASE=110, rows=Math.ceil(s.frames/s.cols); let cur=0, bigSize=0;
  function paintBig(resize){
    if(resize){
      const avail=Math.min(window.innerWidth-32, window.innerHeight-150);
      bigSize=Math.max(240, Math.min(avail, 1100));
      OVL.stage.style.width=bigSize+'px'; OVL.stage.style.height=bigSize+'px';
      OVL.stage.style.backgroundImage='url(assets/'+m.asset+')';
      OVL.stage.style.backgroundSize=(s.cols*bigSize)+'px '+(rows*bigSize)+'px';
    }
    const c=cur%s.cols, r=Math.floor(cur/s.cols);
    OVL.stage.style.backgroundPosition='-'+(c*bigSize)+'px -'+(r*bigSize)+'px';
  }
  function setF(k){
    cur=((k%s.frames)+s.frames)%s.frames;
    const c=cur%s.cols, r=Math.floor(cur/s.cols);
    stage.style.backgroundPosition=`-${c*s.fw}px -${r*s.fh}px`;
    sl.value=cur; fc.textContent=cur+'/'+(s.frames-1); sl.setAttribute('aria-valuetext',(cur+1)+' of '+s.frames);
    if(ovl.classList.contains('open')){ paintBig(false); OVL.sl.value=cur; OVL.fc.textContent=cur+'/'+(s.frames-1); }
  }
  function setBars(sym,lab){pp.textContent=sym; pp.setAttribute('aria-label',lab); OVL.pp.textContent=sym; OVL.pp.setAttribute('aria-label',lab);}
  function play(){clearTimer(); timer=setInterval(()=>setF(cur+1), BASE/parseFloat(spd.value)); setBars('⏸','Pause animation');}
  function pause(){clearTimer(); setBars('▶','Play animation');}
  const toggle=()=>timer?pause():play();
  pp.onclick=OVL.pp.onclick=toggle;
  rs.onclick=OVL.rs.onclick=()=>{pause();setF(0);};
  sl.oninput=()=>{pause();setF(+sl.value);};
  OVL.sl.oninput=()=>{pause();setF(+OVL.sl.value);};
  spd.onchange=()=>{OVL.spd.value=spd.value; if(timer)play();};
  OVL.spd.onchange=()=>{spd.value=OVL.spd.value; if(timer)play();};
  if(enl) enl.onclick=()=>{
    lastEnl=enl; paintBigRef=paintBig;
    OVL.cap.textContent=m.id+' · '+m.name;
    OVL.stage.setAttribute('aria-label', m.id+' '+m.name+' — enlarged animation');
    OVL.sl.max=s.frames-1; OVL.sl.value=cur; OVL.spd.value=spd.value;
    OVL.fc.textContent=cur+'/'+(s.frames-1);
    OVL.pp.textContent=timer?'⏸':'▶'; OVL.pp.setAttribute('aria-label', timer?'Pause animation':'Play animation');
    ovl.classList.add('open'); ovl.setAttribute('aria-hidden','false');
    paintBig(true); OVL.x.focus();
  };
  setF(0);
  if(RM) pause(); else play();
}

function showAbout(){clearTimer(); setSelected('about'); detail.innerHTML='<div class=about>'+OVERVIEW+'</div>';}
function showMethods(){clearTimer(); setSelected('methods'); detail.innerHTML='<div class=about>'+METHODS+'</div>';}

function renderKey(k){
  k=(k||'').trim(); const kl=k.toLowerCase();
  if(kl==='about'){showAbout();return true;}
  if(kl==='methods'){showMethods();return true;}
  const i=M.findIndex(m=>m.id.toLowerCase()===kl);
  if(i>=0){show(i);return true;}
  return false;
}
function navigate(k){
  const target='#'+k;
  if(location.hash!==target){suppressHash=true; location.hash=k;}
  renderKey(k); focusDetail();
}
window.addEventListener('hashchange',()=>{ if(suppressHash){suppressHash=false;return;} renderKey((location.hash||'').replace(/^#/,'')); });

function makeItem(key, nav, htmlStr){
  const e=document.createElement('div');
  e.className='item'+(key==='about'?' about-item':'')+(key==='methods'?' methods-item':'');
  e.dataset.key=String(key); e.dataset.nav=nav;
  if(key==='about') e.id='about-item';
  e.setAttribute('role','option'); e.setAttribute('aria-selected','false'); e.tabIndex=-1;
  e.innerHTML=htmlStr;
  e.onclick=()=>navigate(nav);
  list.appendChild(e);
}
makeItem('about','about','<b>✦</b>About emergence<small>start here — what all 32 share</small>');
makeItem('methods','methods','<b>✓</b>How models are validated<small>what “validated” means here</small>');
M.forEach((m,i)=>makeItem(i, m.id, `<b>${m.id}</b>${m.name}<small>${m.ref}</small>`));

list.addEventListener('keydown', e=>{
  const its=[...list.querySelectorAll('.item')], idx=its.indexOf(document.activeElement);
  if(idx<0) return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault(); navigate(its[idx].dataset.nav); return;}
  let n=-1;
  if(e.key==='ArrowDown') n=Math.min(its.length-1,idx+1);
  else if(e.key==='ArrowUp') n=Math.max(0,idx-1);
  else if(e.key==='Home') n=0;
  else if(e.key==='End') n=its.length-1;
  else return;
  e.preventDefault();
  its.forEach(el=>el.tabIndex=-1); its[n].tabIndex=0; its[n].focus();
});

if(!renderKey((location.hash||'').replace(/^#/,''))) showAbout();
</script></body></html>
